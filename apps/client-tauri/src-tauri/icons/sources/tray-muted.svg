<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="rgb(9, 9, 11)"/>
  <!-- Mic pill body (capsule = rounded rect с rx = w/2) -->
