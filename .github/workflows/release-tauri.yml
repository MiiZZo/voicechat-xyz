name: release-tauri

on:
  push:
    tags:
      - 'tauri-v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x64 on windows-latest.
          - label: x64
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ''
          # Cross-compile ARM64 (Windows on ARM / Snapdragon PCs).
          - label: arm64
            rust_target: aarch64-pc-windows-msvc
            tauri_args: '--target aarch64-pc-windows-msvc'

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client-tauri/src-tauri -> target

      - name: install frontend deps
        working-directory: apps/client-tauri
        run: npm ci

      - name: generate icons
        working-directory: apps/client-tauri
        run: node scripts/generate-icons.mjs

      - name: write vite env
        shell: bash
        working-directory: apps/client-tauri
        env:
          VITE_LOBBY_URL: ${{ vars.VITE_LOBBY_URL || 'https://app.voicechat-xyz.ru' }}
        run: |
          printf 'VITE_LOBBY_URL=%s\n' "$VITE_LOBBY_URL" > .env.local-server
          echo "--- .env.local-server ---"
          cat .env.local-server

      - name: build & publish (${{ matrix.label }})
        uses: tauri-apps/tauri-action@v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'VoiceChat (Tauri) v__VERSION__'
          releaseBody: 'Автосборка Tauri-клиента (Windows x64 + ARM64). См. ассеты для установки.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri_args }}

      - name: assert lobby URL is baked into bundle
        if: matrix.label == 'x64'
        shell: bash
        working-directory: apps/client-tauri
        env:
          EXPECTED_URL: ${{ vars.VITE_LOBBY_URL || 'https://app.voicechat-xyz.ru' }}
        run: |
          set -e
          if [ ! -d dist ]; then
            echo "::error::dist/ not found — vite build did not run"
            exit 1
          fi
          if grep -r --include='*.js' -F 'http://localhost:3000' dist/ ; then
            echo "::error::localhost:3000 found in built bundle — env was not applied"
            exit 1
          fi
          if ! grep -r --include='*.js' -F "$EXPECTED_URL" dist/ > /dev/null; then
            echo "::error::expected URL ($EXPECTED_URL) NOT found in bundle"
            exit 1
          fi
          echo "OK: $EXPECTED_URL is baked into bundle"

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: normalize release & latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --prerelease=false --latest=true
          node apps/client-tauri/scripts/fix-latest-json.mjs
